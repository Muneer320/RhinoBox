upstream rhinobox_api {
    zone rhinobox_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server rhinobox:8090 resolve;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 512m;
    location /api/ {
        # Strip the browser prefix, retaining /api/config on the backend.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://rhinobox_api;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
