services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rhinobox
      POSTGRES_PASSWORD: local-demo-password
      POSTGRES_DB: rhinobox
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rhinobox -d rhinobox"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
  rhinobox:
    build: ./backend
    environment:
      RHINOBOX_ADDR: ":8090"
      RHINOBOX_DATA_DIR: /data
      RHINOBOX_MAX_UPLOAD_MB: "512"
      RHINOBOX_POSTGRES_URL: postgres://rhinobox:local-demo-password@postgres:5432/rhinobox?sslmode=disable
      RHINOBOX_MONGO_URL: mongodb://mongodb:27017/rhinobox
      RHINOBOX_DB_MAX_CONNS: "10"
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - rhinobox_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgres: { condition: service_healthy }
      mongodb: { condition: service_healthy }
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      rhinobox: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
  mongo_data:
  rhinobox_data:
